<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress · AI FITNESS COACH</title>
<script src="js/theme.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><link href="css/animations.css" rel="stylesheet"><link href="css/responsive.css" rel="stylesheet">
</head>
<body>
<div class="app-shell"><aside id="sidebarMount"></aside>
<div class="app-body"><header id="headerMount"></header><main class="app-main" id="mainContent">

<div class="page-head reveal">
  <h1><i class="bi bi-graph-up text-primary me-2"></i>Progress Tracker</h1>
  <p class="text-muted-2">Your fitness journey at a glance</p>
</div>

<!-- Timeframe chips -->
<div class="d-flex gap-2 mb-4 reveal" id="timeframeChips">
  <button class="chip" data-days="7">7 DAYS</button>
  <button class="chip fire active-tf" data-days="14">14 DAYS</button>
  <button class="chip" data-days="30">30 DAYS</button>
</div>

<!-- Stat cards -->
<div class="row g-3 mb-4" id="statsRow">
  <div class="col-sm-6 col-lg-4 reveal">
    <div class="tile tile-pad stat-card">
      <div class="stat-icon"><i class="bi bi-speedometer2"></i></div>
      <div><div class="stat-value" id="statWeightChange">--</div><div class="stat-label">Weight Change (kg)</div></div>
    </div>
  </div>
  <div class="col-sm-6 col-lg-4 reveal">
    <div class="tile tile-pad stat-card">
      <div class="stat-icon green"><i class="bi bi-check-circle-fill"></i></div>
      <div><div class="stat-value" id="statWorkouts">0</div><div class="stat-label">Workouts Completed</div></div>
    </div>
  </div>
  <div class="col-sm-6 col-lg-4 reveal">
    <div class="tile tile-pad stat-card">
      <div class="stat-icon blue"><i class="bi bi-clock-fill"></i></div>
      <div><div class="stat-value" id="statMinutes">0</div><div class="stat-label">Total Workout Min</div></div>
    </div>
  </div>
  <div class="col-sm-6 col-lg-4 reveal">
    <div class="tile tile-pad stat-card">
      <div class="stat-icon amber"><i class="bi bi-droplet-fill"></i></div>
      <div><div class="stat-value" id="statAvgWater">0</div><div class="stat-label">Avg Water / Day</div></div>
    </div>
  </div>
  <div class="col-sm-6 col-lg-4 reveal">
    <div class="tile tile-pad stat-card">
      <div class="stat-icon green"><i class="bi bi-egg-fried"></i></div>
      <div><div class="stat-value" id="statMeals">0</div><div class="stat-label">Meals Completed</div></div>
    </div>
  </div>
  <div class="col-sm-6 col-lg-4 reveal">
    <div class="tile tile-pad stat-card">
      <div class="stat-icon red"><i class="bi bi-fire"></i></div>
      <div><div class="stat-value" id="statStreak">0</div><div class="stat-label">Current Streak</div></div>
    </div>
  </div>
</div>

<!-- Charts -->
<div class="row g-3" id="chartsRow">
  <div class="col-md-6 reveal">
    <div class="tile tile-pad chart-box">
      <h4 class="section-title"><i class="bi bi-speedometer2"></i>Weight</h4>
      <div id="chartWeight"></div>
    </div>
  </div>
  <div class="col-md-6 reveal">
    <div class="tile tile-pad chart-box">
      <h4 class="section-title"><i class="bi bi-droplet-fill"></i>Water Intake</h4>
      <div id="chartWater"></div>
    </div>
  </div>
  <div class="col-md-6 reveal">
    <div class="tile tile-pad chart-box">
      <h4 class="section-title"><i class="bi bi-clock-fill"></i>Workout Minutes</h4>
      <div id="chartWorkout"></div>
    </div>
  </div>
  <div class="col-md-6 reveal">
    <div class="tile tile-pad chart-box">
      <h4 class="section-title"><i class="bi bi-egg-fried"></i>Meals Completed</h4>
      <div id="chartMeals"></div>
    </div>
  </div>
</div>

</main></div></div>
<nav id="bottomNavMount"></nav>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/firebase-config.js"></script><script src="js/utils.js"></script>
<script src="js/firebase-auth.js"></script><script src="js/firebase-db.js"></script>
<script src="js/firebase-storage.js"></script><script src="js/app.js"></script>
<script src="js/streak.js"></script><script src="js/chatbot.js"></script>
<script src="js/progress.js"></script>
</body></html>
