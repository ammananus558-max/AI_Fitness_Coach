<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subscription · AI FITNESS COACH</title>
<script src="js/theme.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><link href="css/animations.css" rel="stylesheet"><link href="css/responsive.css" rel="stylesheet">
</head>
<body>
<div class="app-shell"><aside id="sidebarMount"></aside>
<div class="app-body"><header id="headerMount"></header><main class="app-main" id="mainContent">

<div class="container-lg py-4">
  <!-- Trial / Premium banner -->
  <div id="trialBanner" class="mb-4"></div>

  <!-- Plans heading -->
  <h2 class="mb-1"><i class="bi bi-gem me-2 gradient-text" aria-hidden="true"></i>Choose Your Plan</h2>
  <p class="text-muted-2 mb-4">Unlock full access to workouts, diet plans, and AI coaching.</p>

  <!-- Plans grid -->
  <div id="plansGrid" class="row g-3 mb-4"></div>

  <!-- Manage section -->
  <div id="manageSection" class="d-none">
    <div class="tile tile-pad">
      <h5 class="mb-3"><i class="bi bi-sliders me-2" aria-hidden="true"></i>Manage Subscription</h5>
      <p class="text-muted-2 mb-3" id="manageInfo"></p>
      <button class="btn btn-outline-danger btn-sm" id="cancelSubBtn"><i class="bi bi-x-circle me-1" aria-hidden="true"></i>Cancel Subscription</button>
    </div>
  </div>
</div>

<!-- Checkout modal -->
<div class="modal fade" id="checkoutModal" tabindex="-1" aria-labelledby="checkoutTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="checkoutTitle">Checkout</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="checkoutBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-fire" id="confirmPurchaseBtn">Confirm Purchase</button>
      </div>
    </div>
  </div>
</div>

</main></div></div>
<nav id="bottomNavMount"></nav>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/firebase-config.js"></script><script src="js/utils.js"></script>
<script src="js/firebase-auth.js"></script><script src="js/firebase-db.js"></script>
<script src="js/firebase-storage.js"></script><script src="js/app.js"></script>
<script src="js/streak.js"></script><script src="js/chatbot.js"></script>
<script src="js/subscription.js"></script>
</body></html>
