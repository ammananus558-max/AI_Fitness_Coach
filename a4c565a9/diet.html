<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diet Plans · AI FITNESS COACH</title>
<script src="js/theme.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><link href="css/animations.css" rel="stylesheet"><link href="css/responsive.css" rel="stylesheet">
</head>
<body>
<div class="app-shell"><aside id="sidebarMount"></aside>
<div class="app-body"><header id="headerMount"></header><main class="app-main" id="mainContent">

<div class="page-head reveal">
  <h1><i class="bi bi-basket-fill text-primary me-2"></i>Diet Plans</h1>
  <p class="text-muted-2">Browse plans and mark meals completed</p>
</div>

<!-- Diet plan cards -->
<div class="section-title reveal"><i class="bi bi-journal-text"></i>Available Plans</div>
<div class="row g-3 mb-4" id="plansGrid"></div>

<!-- Category tabs -->
<div class="d-flex gap-2 flex-wrap mb-3 reveal" id="categoryTabs" role="tablist">
  <button class="chip fire active-tab" data-cat="breakfast" role="tab" aria-selected="true">BREAKFAST</button>
  <button class="chip" data-cat="lunch" role="tab" aria-selected="false">LUNCH</button>
  <button class="chip" data-cat="snack" role="tab" aria-selected="false">SNACK</button>
  <button class="chip" data-cat="dinner" role="tab" aria-selected="false">DINNER</button>
</div>

<!-- Meal grid -->
<div class="row g-3" id="mealsGrid"></div>

</main></div></div>
<nav id="bottomNavMount"></nav>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/firebase-config.js"></script><script src="js/utils.js"></script>
<script src="js/firebase-auth.js"></script><script src="js/firebase-db.js"></script>
<script src="js/firebase-storage.js"></script><script src="js/app.js"></script>
<script src="js/streak.js"></script><script src="js/chatbot.js"></script>
<script src="js/diet.js"></script>
</body></html>
