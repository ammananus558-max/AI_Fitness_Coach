<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Habits · AI FITNESS COACH</title>
<script src="js/theme.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><link href="css/animations.css" rel="stylesheet"><link href="css/responsive.css" rel="stylesheet">
</head>
<body>
<div class="app-shell"><aside id="sidebarMount"></aside>
<div class="app-body"><header id="headerMount"></header><main class="app-main" id="mainContent">

<div class="page-head reveal">
  <h1><i class="bi bi-check2-circle text-primary me-2"></i>Daily Habits</h1>
  <p class="text-muted-2">Build consistency one day at a time</p>
</div>

<!-- Progress bar -->
<div class="tile tile-pad mb-4 reveal">
  <div class="d-flex align-items-center justify-content-between mb-2">
    <span class="stat-label">TODAY'S PROGRESS</span>
    <span class="fw-bold" id="habitProgressText">0 / 5 completed</span>
  </div>
  <div class="progress-2"><div class="bar" id="habitProgressBar" style="width:0%"></div></div>
</div>

<!-- Habit list -->
<div class="tile mb-4 reveal" id="habitsList"></div>

<!-- Streak hint -->
<div class="tile tile-pad reveal">
  <div class="d-flex align-items-center gap-3">
    <div class="icon-bubble"><i class="bi bi-fire"></i></div>
    <div>
      <strong>Keep your streak alive!</strong>
      <p class="text-muted-2 mb-0" style="font-size:.88rem" id="streakHint">Complete workouts daily to build your streak.</p>
    </div>
  </div>
</div>

</main></div></div>
<nav id="bottomNavMount"></nav>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/firebase-config.js"></script><script src="js/utils.js"></script>
<script src="js/firebase-auth.js"></script><script src="js/firebase-db.js"></script>
<script src="js/firebase-storage.js"></script><script src="js/app.js"></script>
<script src="js/streak.js"></script><script src="js/chatbot.js"></script>
<script src="js/habits.js"></script>
</body></html>
