<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Before &amp; After · AI FITNESS COACH</title>
<script src="js/theme.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><link href="css/animations.css" rel="stylesheet"><link href="css/responsive.css" rel="stylesheet">
</head>
<body>
<div class="app-shell"><aside id="sidebarMount"></aside>
<div class="app-body"><header id="headerMount"></header><main class="app-main" id="mainContent">

<div class="page-head reveal">
  <h1><i class="bi bi-images text-primary me-2"></i>Track Your Transformation</h1>
  <p class="text-muted-2">This is your personal progress space — every body is a work in progress.</p>
</div>

<!-- View tabs -->
<div class="d-flex gap-2 flex-wrap mb-4 reveal" id="viewTabs" role="tablist">
  <button class="chip fire active-view" data-view="front" role="tab" aria-selected="true">FRONT</button>
  <button class="chip" data-view="back" role="tab" aria-selected="false">BACK</button>
  <button class="chip" data-view="left" role="tab" aria-selected="false">LEFT</button>
  <button class="chip" data-view="right" role="tab" aria-selected="false">RIGHT</button>
</div>

<!-- Upload slots per view -->
<div id="uploadSection" class="reveal">
  <div class="row g-3 mb-4">
    <div class="col-sm-6">
      <label class="form-label fw-bold">BEFORE</label>
      <div class="upload-slot" id="slotBefore" tabindex="0" role="button" aria-label="Upload before photo">
        <i class="bi bi-camera-fill" style="font-size:2rem" aria-hidden="true"></i>
        <span>Tap to upload BEFORE photo</span>
      </div>
    </div>
    <div class="col-sm-6">
      <label class="form-label fw-bold">AFTER</label>
      <div class="upload-slot" id="slotAfter" tabindex="0" role="button" aria-label="Upload after photo">
        <i class="bi bi-camera-fill" style="font-size:2rem" aria-hidden="true"></i>
        <span>Tap to upload AFTER photo</span>
      </div>
    </div>
  </div>
</div>

<!-- Dates + Notes -->
<div class="tile tile-pad mb-4 reveal">
  <h3 class="section-title"><i class="bi bi-pencil-square"></i>Details</h3>
  <div class="row g-3">
    <div class="col-sm-6">
      <label for="beforeDate" class="form-label">Before Date</label>
      <input type="date" class="form-control" id="beforeDate">
    </div>
    <div class="col-sm-6">
      <label for="afterDate" class="form-label">After Date</label>
      <input type="date" class="form-control" id="afterDate">
    </div>
    <div class="col-12">
      <label for="notesInput" class="form-label">Notes</label>
      <textarea class="form-control" id="notesInput" rows="2" placeholder="How are you feeling about your progress?"></textarea>
    </div>
    <div class="col-12">
      <button class="btn btn-fire" id="saveDetailsBtn">Save Details</button>
    </div>
  </div>
</div>

<!-- Comparison slider -->
<div class="tile tile-pad mb-4 reveal">
  <h3 class="section-title"><i class="bi bi-sliders"></i>Comparison Slider</h3>
  <div id="comparisonArea">
    <div class="empty-state" id="sliderEmpty">
      <i class="bi bi-images"></i>
      <p>Upload your first progress photo.</p>
    </div>
    <div class="ba-stage" id="baStage" style="display:none;--split:50%">
      <img id="baBeforeImg" alt="Before photo">
      <img id="baAfterImg" class="ba-after" alt="After photo">
      <div class="ba-handle" id="baHandle"></div>
      <span class="ba-tag" style="left:12px">BEFORE</span>
      <span class="ba-tag" style="right:12px">AFTER</span>
    </div>
  </div>
</div>

</main></div></div>
<nav id="bottomNavMount"></nav>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/firebase-config.js"></script><script src="js/utils.js"></script>
<script src="js/firebase-auth.js"></script><script src="js/firebase-db.js"></script>
<script src="js/firebase-storage.js"></script><script src="js/app.js"></script>
<script src="js/streak.js"></script><script src="js/chatbot.js"></script>
<script src="js/before-after.js"></script>
</body></html>
