<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMI Calculator · AI FITNESS COACH</title>
<script src="js/theme.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><link href="css/animations.css" rel="stylesheet"><link href="css/responsive.css" rel="stylesheet">
</head>
<body>
<div class="app-shell"><aside id="sidebarMount"></aside>
<div class="app-body"><header id="headerMount"></header><main class="app-main" id="mainContent">

<div class="page-head reveal">
  <h1><i class="bi bi-activity text-primary me-2"></i>BMI Calculator</h1>
  <p class="text-muted-2">Calculate your Body Mass Index</p>
</div>

<div class="row g-4">
  <!-- Input form -->
  <div class="col-lg-5 reveal">
    <div class="tile tile-pad">
      <h3 class="section-title"><i class="bi bi-rulers"></i>Your Measurements</h3>
      <form id="bmiForm" novalidate>
        <div class="mb-3">
          <label for="heightInput" class="form-label">Height (cm)</label>
          <input type="number" class="form-control" id="heightInput" min="50" max="300" step="0.1" required placeholder="e.g. 175">
          <div class="invalid-feedback-2"></div>
        </div>
        <div class="mb-3">
          <label for="weightInput" class="form-label">Weight (kg)</label>
          <input type="number" class="form-control" id="weightInput" min="10" max="500" step="0.1" required placeholder="e.g. 70">
          <div class="invalid-feedback-2"></div>
        </div>
        <button type="submit" class="btn btn-fire btn-block btn-lg-2" id="calcBtn">
          <i class="bi bi-calculator me-1"></i>CALCULATE BMI
        </button>
      </form>
    </div>
  </div>

  <!-- Results -->
  <div class="col-lg-7 reveal" id="resultsCol" style="display:none">
    <div class="tile tile-pad text-center mb-4">
      <!-- Gauge -->
      <div class="gauge-wrap" id="gaugeWrap">
        <svg viewBox="0 0 240 130" width="240" height="130" aria-label="BMI gauge">
          <path d="M20,120 A100,100 0 0,1 220,120" fill="none" stroke="var(--surface-2)" stroke-width="18" stroke-linecap="round"/>
          <path id="gaugeArc" d="M20,120 A100,100 0 0,1 220,120" fill="none" stroke="var(--primary)" stroke-width="18" stroke-linecap="round" stroke-dasharray="314" stroke-dashoffset="314" style="transition:stroke-dashoffset .9s cubic-bezier(.3,.8,.3,1),stroke .4s"/>
          <line id="gaugeNeedle" x1="120" y1="120" x2="120" y2="30" stroke="var(--text)" stroke-width="3" stroke-linecap="round" style="transform-origin:120px 120px;transition:transform .9s cubic-bezier(.3,.8,.3,1)"/>
          <circle cx="120" cy="120" r="6" fill="var(--text)"/>
        </svg>
        <div class="gauge-value" id="bmiValue">--</div>
      </div>
      <div class="gauge-label" id="bmiCategoryLabel"></div>

      <!-- Scale legend -->
      <div class="d-flex justify-content-center gap-1 mt-3 flex-wrap" id="scaleLegend">
        <span class="chip amber" data-seg="underweight">Underweight &lt;18.5</span>
        <span class="chip green" data-seg="normal">Normal 18.5–24.9</span>
        <span class="chip amber" data-seg="overweight">Overweight 25–29.9</span>
        <span class="chip red" data-seg="obesity">Obesity ≥30</span>
      </div>
    </div>

    <!-- Disclaimer + actions -->
    <div class="tile tile-pad">
      <p class="form-hint mb-3"><i class="bi bi-info-circle me-1"></i>BMI is a general screening estimate and is not a medical diagnosis.</p>
      <div class="d-flex gap-3 flex-wrap">
        <a href="calories.html?setup=1" class="btn btn-fire btn-lg-2" id="continueBtn">CONTINUE</a>
        <a href="dashboard.html" class="btn btn-ghost btn-lg-2">Go to Dashboard</a>
      </div>
    </div>
  </div>
</div>

</main></div></div>
<nav id="bottomNavMount"></nav>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/firebase-config.js"></script><script src="js/utils.js"></script>
<script src="js/firebase-auth.js"></script><script src="js/firebase-db.js"></script>
<script src="js/firebase-storage.js"></script><script src="js/app.js"></script>
<script src="js/streak.js"></script><script src="js/chatbot.js"></script>
<script src="js/bmi.js"></script>
</body></html>
