<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calorie Calculator · AI FITNESS COACH</title>
<script src="js/theme.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><link href="css/animations.css" rel="stylesheet"><link href="css/responsive.css" rel="stylesheet">
</head>
<body>
<div class="app-shell"><aside id="sidebarMount"></aside>
<div class="app-body"><header id="headerMount"></header><main class="app-main" id="mainContent">

<div class="page-head reveal">
  <h1><i class="bi bi-fire text-primary me-2"></i>Calorie Calculator</h1>
  <p class="text-muted-2">Estimate your daily calorie needs</p>
</div>

<div class="row g-4">
  <!-- Input form -->
  <div class="col-lg-5 reveal">
    <div class="tile tile-pad">
      <h3 class="section-title"><i class="bi bi-sliders"></i>Your Details</h3>
      <form id="calForm" novalidate>
        <div class="mb-3">
          <label for="ageInput" class="form-label">Age</label>
          <input type="number" class="form-control" id="ageInput" min="10" max="120" required placeholder="e.g. 25">
          <div class="invalid-feedback-2"></div>
        </div>
        <div class="mb-3">
          <label for="genderSelect" class="form-label">Gender</label>
          <select class="form-select" id="genderSelect" required>
            <option value="">Select...</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
          <div class="invalid-feedback-2"></div>
        </div>
        <div class="mb-3">
          <label for="heightInput" class="form-label">Height (cm)</label>
          <input type="number" class="form-control" id="heightInput" min="50" max="300" step="0.1" required placeholder="e.g. 175">
          <div class="invalid-feedback-2"></div>
        </div>
        <div class="mb-3">
          <label for="weightInput" class="form-label">Weight (kg)</label>
          <input type="number" class="form-control" id="weightInput" min="10" max="500" step="0.1" required placeholder="e.g. 70">
          <div class="invalid-feedback-2"></div>
        </div>
        <div class="mb-3">
          <label for="activitySelect" class="form-label">Activity Level</label>
          <select class="form-select" id="activitySelect" required>
            <option value="">Select...</option>
            <option value="sedentary">Sedentary (little or no exercise)</option>
            <option value="light">Light (1–3 days/week)</option>
            <option value="moderate">Moderate (3–5 days/week)</option>
            <option value="very">Very Active (6–7 days/week)</option>
          </select>
          <div class="invalid-feedback-2"></div>
        </div>
        <button type="submit" class="btn btn-fire btn-block btn-lg-2" id="calcBtn">
          <i class="bi bi-calculator me-1"></i>CALCULATE
        </button>
      </form>
    </div>
  </div>

  <!-- Results -->
  <div class="col-lg-7 reveal" id="resultsCol" style="display:none">
    <div class="row g-3 mb-4">
      <div class="col-sm-6">
        <div class="tile tile-pad stat-card">
          <div class="stat-icon blue"><i class="bi bi-heart-pulse"></i></div>
          <div>
            <div class="stat-value" id="bmrVal">--</div>
            <div class="stat-label">BMR (kcal/day)</div>
          </div>
        </div>
      </div>
      <div class="col-sm-6">
        <div class="tile tile-pad stat-card">
          <div class="stat-icon amber"><i class="bi bi-lightning-charge"></i></div>
          <div>
            <div class="stat-value" id="maintVal">--</div>
            <div class="stat-label">Maintenance (kcal/day)</div>
          </div>
        </div>
      </div>
    </div>

    <div class="tile tile-pad text-center mb-4">
      <p class="stat-label mb-1">YOUR DAILY TARGET</p>
      <div style="font-size:3rem;font-weight:900;line-height:1">
        <span id="targetVal">--</span> <span style="font-size:1.2rem;color:var(--muted)">kcal/day</span>
      </div>
    </div>

    <div class="tile tile-pad">
      <p class="form-hint mb-3"><i class="bi bi-info-circle me-1"></i>Calorie estimates are general wellness estimates and are not medical advice.</p>
      <div class="d-flex gap-3 flex-wrap">
        <a href="dashboard.html" class="btn btn-fire btn-lg-2" id="continueBtn">CONTINUE TO DASHBOARD</a>
      </div>
    </div>
  </div>
</div>

</main></div></div>
<nav id="bottomNavMount"></nav>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/firebase-config.js"></script><script src="js/utils.js"></script>
<script src="js/firebase-auth.js"></script><script src="js/firebase-db.js"></script>
<script src="js/firebase-storage.js"></script><script src="js/app.js"></script>
<script src="js/streak.js"></script><script src="js/chatbot.js"></script>
<script src="js/calories.js"></script>
</body></html>
