<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today's Meals · AI FITNESS COACH</title>
<script src="js/theme.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><link href="css/animations.css" rel="stylesheet"><link href="css/responsive.css" rel="stylesheet">
</head>
<body>
<div class="app-shell"><aside id="sidebarMount"></aside>
<div class="app-body"><header id="headerMount"></header><main class="app-main" id="mainContent">

<div class="page-head reveal">
  <h1><i class="bi bi-egg-fried text-primary me-2"></i>Today's Meals</h1>
  <p class="text-muted-2" id="dateDisplay"></p>
</div>

<!-- Daily summary bar -->
<div class="tile tile-pad mb-4 reveal" id="summaryBar">
  <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
    <div>
      <span class="stat-label">COMPLETED</span>
      <span class="fw-bold ms-1" id="completedCount">0 / 4</span>
    </div>
    <div>
      <span class="stat-label">TOTAL KCAL</span>
      <span class="fw-bold ms-1" id="totalKcal">0</span>
    </div>
  </div>
  <div class="progress-2 mt-2"><div class="bar" id="mealProgress" style="width:0%"></div></div>
</div>

<!-- Rest day note -->
<div class="tile tile-pad mb-4 reveal" id="restDayNote" style="display:none">
  <div class="d-flex align-items-center gap-3">
    <div class="icon-bubble"><i class="bi bi-moon-stars-fill"></i></div>
    <div>
      <strong>Rest Day</strong>
      <p class="text-muted-2 mb-0" style="font-size:.88rem">Take it easy today. Stay hydrated and nourish your body.</p>
    </div>
  </div>
</div>

<!-- Meal cards -->
<div class="row g-3" id="mealsContainer"></div>

</main></div></div>
<nav id="bottomNavMount"></nav>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/firebase-config.js"></script><script src="js/utils.js"></script>
<script src="js/firebase-auth.js"></script><script src="js/firebase-db.js"></script>
<script src="js/firebase-storage.js"></script><script src="js/app.js"></script>
<script src="js/streak.js"></script><script src="js/chatbot.js"></script>
<script src="js/meals.js"></script>
</body></html>
