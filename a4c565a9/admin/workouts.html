<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workouts · Admin · AI FITNESS COACH</title>
<script src="../js/theme.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet"><link href="../css/admin.css" rel="stylesheet">
<link href="../css/animations.css" rel="stylesheet"><link href="../css/responsive.css" rel="stylesheet">
</head>
<body>
<div class="admin-shell"><aside id="sidebarMount"></aside>
<div class="admin-body"><header id="headerMount"></header><main class="admin-main" id="mainContent">
  <div class="admin-toolbar">
    <input type="text" class="form-control search-box" id="searchInput" placeholder="Search workouts...">
    <button class="btn btn-fire" id="addBtn"><i class="bi bi-plus-lg me-1"></i>Add Workout</button>
  </div>
  <div class="tile admin-table-card" id="tableWrap"></div>
</main></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/firebase-config.js"></script><script src="../js/utils.js"></script>
<script src="../js/firebase-auth.js"></script><script src="../js/firebase-db.js"></script>
<script src="../js/firebase-storage.js"></script><script src="../js/app.js"></script>
<script src="../js/admin-auth.js"></script><script src="../js/admin.js"></script>
<script>
(async function () {
  try { await requireAdmin(); } catch (e) { return; }
  afcMountLayout("workouts", { admin: true });

  var allData = {};
  var exerciseKeys = [];
  var goals = ["lose-weight","gain-muscle","stay-healthy","improve-fitness"];
  var levels = ["Beginner","Intermediate","Advanced"];
  var days = ["full","core","chest","back","arms","legs","cardio"];

  function workoutFields(w) {
    w = w || {};
    var exList = Array.isArray(w.exercises) ? w.exercises.join(", ") : (w.exercises || "");
    return [
      { key: "name", label: "Name", type: "text", value: w.name || "" },
      { key: "goal", label: "Goal", type: "select", options: goals, value: w.goal || "" },
      { key: "level", label: "Level", type: "select", options: levels, value: w.level || "" },
      { key: "day", label: "Day Focus", type: "select", options: days, value: w.day || "full" },
      { key: "duration", label: "Duration (min)", type: "number", value: w.duration || 20, min: 1 },
      { key: "description", label: "Description", textarea: true, rows: 2, value: w.description || "" },
      { key: "exercises", label: "Exercises (comma-separated keys)", textarea: true, rows: 3, value: exList, placeholder: "squats, push-ups, plank" },
      { key: "media", label: "Media URL", type: "text", value: w.media || "", placeholder: "https://..." }
    ];
  }

  function renderTable() {
    var html = afcAdminTable({
      columns: [
        { key: "name", label: "Name" },
        { key: "goal", label: "Goal" },
        { key: "level", label: "Level" },
        { key: "day", label: "Day" },
        { key: "duration", label: "Min" },
        { key: "_active", label: "Active", render: function (row) {
          return row.active !== false ? '<span class="badge bg-success">Yes</span>' : '<span class="badge bg-secondary">No</span>';
        }}
      ],
      rows: allData,
      actions: [
        { icon: "pencil-square", title: "EDIT", cls: "btn-outline-warning" },
        { icon: "copy", title: "DUPLICATE", cls: "btn-outline-info" },
        { icon: "power", title: "TOGGLE_ACTIVE", cls: "btn-outline-secondary" },
        { icon: "trash3-fill", title: "DELETE", cls: "btn-outline-danger" }
      ]
    });
    document.getElementById("tableWrap").innerHTML = html;
    afcAdminSearchFilter("#searchInput", "#tableWrap tr[data-key]");
  }

  afcLoader("Loading workouts...");
  try {
    var exObj = await afcDbGet("exercises") || {};
    exerciseKeys = Object.keys(exObj);

    await afcDbOnValue("workouts", function (data) {
      allData = data || {};
      renderTable();
      afcLoaderOff();
    });
  } catch (err) { afcToast("Failed to load workouts.", "error"); afcLoaderOff(); }

  document.getElementById("addBtn").addEventListener("click", async function () {
    var data = await afcFormModal({ title: "Add Workout", fields: workoutFields(), okText: "Save" });
    if (!data) return;
    var slug = afcSlugify(data.name);
    if (!slug) { afcToast("Enter a valid name.", "error"); return; }
    var exArr = data.exercises.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
    afcLoader("Saving...");
    try {
      await afcDbSet("workouts/" + slug, {
        name: data.name, goal: data.goal, level: data.level, day: data.day,
        duration: Number(data.duration) || 20, description: data.description,
        exercises: exArr, media: data.media || "", active: true
      });
      afcToast("Workout saved.", "success");
    } catch (err) { afcToast("Failed to save.", "error"); }
    afcLoaderOff();
  });

  afcAdminBindActions(document.getElementById("tableWrap"), {
    EDIT: async function (key) {
      var w = allData[key]; if (!w) return;
      var data = await afcFormModal({ title: "Edit Workout", fields: workoutFields(w), okText: "Save" });
      if (!data) return;
      var exArr = data.exercises.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
      afcLoader("Saving...");
      try {
        await afcDbUpdate("workouts/" + key, {
          name: data.name, goal: data.goal, level: data.level, day: data.day,
          duration: Number(data.duration) || 20, description: data.description,
          exercises: exArr, media: data.media || ""
        });
        afcToast("Workout updated.", "success");
      } catch (err) { afcToast("Failed to update.", "error"); }
      afcLoaderOff();
    },
    DUPLICATE: async function (key) {
      var w = allData[key]; if (!w) return;
      var newKey = key + "-copy";
      afcLoader("Duplicating...");
      try {
        var copy = JSON.parse(JSON.stringify(w));
        copy.name = w.name + " (Copy)";
        await afcDbSet("workouts/" + newKey, copy);
        afcToast("Workout duplicated.", "success");
      } catch (err) { afcToast("Failed to duplicate.", "error"); }
      afcLoaderOff();
    },
    TOGGLE_ACTIVE: async function (key) {
      afcLoader("Toggling...");
      try {
        var newVal = await afcToggleField("workouts/" + key, "active");
        afcToast(newVal ? "Workout activated." : "Workout deactivated.", "success");
      } catch (err) { afcToast("Failed to toggle.", "error"); }
      afcLoaderOff();
    },
    DELETE: async function (key) {
      var ok = await afcConfirmDelete("workout " + key);
      if (!ok) return;
      afcLoader("Deleting...");
      try { await afcDbRemove("workouts/" + key); afcToast("Workout deleted.", "success"); }
      catch (err) { afcToast("Failed to delete.", "error"); }
      afcLoaderOff();
    }
  });
})();
</script>
</body>
</html>
