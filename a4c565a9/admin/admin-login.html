<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login · AI FITNESS COACH</title>
<script src="../js/theme.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet"><link href="../css/admin.css" rel="stylesheet">
<link href="../css/animations.css" rel="stylesheet"><link href="../css/responsive.css" rel="stylesheet">
<style>
  .admin-login-bg {
    min-height: 100vh; display: grid; place-items: center;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    padding: 1rem;
  }
  .admin-login-card {
    width: 100%; max-width: 420px;
    background: var(--surface); border-radius: var(--radius-lg, 1rem);
    padding: 2.5rem 2rem; box-shadow: var(--shadow-lg);
  }
  .admin-login-card .brand-badge { margin: 0 auto 0.8rem; }
</style>
</head>
<body>
<div class="admin-login-bg">
  <div class="auth-card admin-login-card anim-scale" id="loginCard">
    <div class="text-center mb-4">
      <div class="brand-badge"><i class="bi bi-heart-pulse-fill" aria-hidden="true"></i></div>
      <h2 class="fw-bold mt-2">ADMIN LOGIN</h2>
      <p class="text-muted-2 small">AI FITNESS COACH Administration</p>
    </div>
    <form id="adminLoginForm" autocomplete="on">
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input type="email" class="form-control" id="email" placeholder="admin@example.com" required autocomplete="email">
      </div>
      <div class="mb-4">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Enter password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-fire w-100" id="loginBtn">LOGIN</button>
    </form>
    <div class="text-center mt-3">
      <a href="../login.html" class="text-muted-2 small text-decoration-none">&larr; Back to User Login</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/firebase-auth.js"></script>
<script src="../js/firebase-db.js"></script>
<script src="../js/firebase-storage.js"></script>
<script src="../js/app.js"></script>
<script src="../js/admin-auth.js"></script>
<script src="../js/admin.js"></script>
<script>
(function () {
  var form = document.getElementById("adminLoginForm");
  var btn = document.getElementById("loginBtn");

  /* Handle FIREBASE_NOT_CONFIGURED */
  if (!window.AFC_FIREBASE_READY) {
    afcSetupBanner();
    return;
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    var email = document.getElementById("email").value.trim();
    var password = document.getElementById("password").value;
    if (!email || !password) { afcToast("Please fill in all fields.", "error"); return; }

    afcBusy(btn, true, "Signing in...");
    try {
      await afcAdminLogin(email, password);
      location.href = "dashboard.html";
    } catch (err) {
      afcBusy(btn, false);
      if (err && err.message === "NOT_ADMIN") {
        afcToast("Not authorized as admin.", "error");
      } else if (err && err.message === "FIREBASE_NOT_CONFIGURED") {
        afcSetupBanner();
      } else {
        afcToast(afcFriendlyAuthError(err), "error");
      }
    }
  });
})();
</script>
</body>
</html>
