<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diet Plans · Admin · AI FITNESS COACH</title>
<script src="../js/theme.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet"><link href="../css/admin.css" rel="stylesheet">
<link href="../css/animations.css" rel="stylesheet"><link href="../css/responsive.css" rel="stylesheet">
</head>
<body>
<div class="admin-shell"><aside id="sidebarMount"></aside>
<div class="admin-body"><header id="headerMount"></header><main class="admin-main" id="mainContent">
  <div class="admin-toolbar">
    <input type="text" class="form-control search-box" id="searchInput" placeholder="Search diet plans...">
    <button class="btn btn-fire" id="addBtn"><i class="bi bi-plus-lg me-1"></i>Add Diet Plan</button>
  </div>
  <div class="tile admin-table-card" id="tableWrap"></div>
</main></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/firebase-config.js"></script><script src="../js/utils.js"></script>
<script src="../js/firebase-auth.js"></script><script src="../js/firebase-db.js"></script>
<script src="../js/firebase-storage.js"></script><script src="../js/app.js"></script>
<script src="../js/admin-auth.js"></script><script src="../js/admin.js"></script>
<script>
(async function () {
  try { await requireAdmin(); } catch (e) { return; }
  afcMountLayout("diet", { admin: true });

  var allData = {};

  function dietFields(d) {
    d = d || {};
    var mealsList = Array.isArray(d.meals) ? d.meals.join(", ") : (d.meals || "");
    return [
      { key: "name", label: "Name", type: "text", value: d.name || "" },
      { key: "description", label: "Description", textarea: true, rows: 2, value: d.description || "" },
      { key: "meals", label: "Meals (comma-separated keys)", textarea: true, rows: 3, value: mealsList, placeholder: "oatmeal-banana, chicken-rice" }
    ];
  }

  function renderTable() {
    var html = afcAdminTable({
      columns: [
        { key: "name", label: "Name" },
        { key: "description", label: "Description" },
        { key: "_active", label: "Active", render: function (row) {
          return row.active !== false ? '<span class="badge bg-success">Yes</span>' : '<span class="badge bg-secondary">No</span>';
        }}
      ],
      rows: allData,
      actions: [
        { icon: "pencil-square", title: "EDIT", cls: "btn-outline-warning" },
        { icon: "power", title: "TOGGLE_ACTIVE", cls: "btn-outline-secondary" },
        { icon: "trash3-fill", title: "DELETE", cls: "btn-outline-danger" }
      ]
    });
    document.getElementById("tableWrap").innerHTML = html;
    afcAdminSearchFilter("#searchInput", "#tableWrap tr[data-key]");
  }

  afcLoader("Loading diet plans...");
  try {
    await afcDbOnValue("dietPlans", function (data) {
      allData = data || {};
      renderTable();
      afcLoaderOff();
    });
  } catch (err) { afcToast("Failed to load diet plans.", "error"); afcLoaderOff(); }

  document.getElementById("addBtn").addEventListener("click", async function () {
    var data = await afcFormModal({ title: "Add Diet Plan", fields: dietFields(), okText: "Save" });
    if (!data) return;
    var slug = afcSlugify(data.name);
    if (!slug) { afcToast("Enter a valid name.", "error"); return; }
    var mealsArr = data.meals.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
    afcLoader("Saving...");
    try {
      await afcDbSet("dietPlans/" + slug, { name: data.name, description: data.description, meals: mealsArr, active: true });
      afcToast("Diet plan saved.", "success");
    } catch (err) { afcToast("Failed to save.", "error"); }
    afcLoaderOff();
  });

  afcAdminBindActions(document.getElementById("tableWrap"), {
    EDIT: async function (key) {
      var d = allData[key]; if (!d) return;
      var data = await afcFormModal({ title: "Edit Diet Plan", fields: dietFields(d), okText: "Save" });
      if (!data) return;
      var mealsArr = data.meals.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
      afcLoader("Saving...");
      try {
        await afcDbUpdate("dietPlans/" + key, { name: data.name, description: data.description, meals: mealsArr });
        afcToast("Diet plan updated.", "success");
      } catch (err) { afcToast("Failed to update.", "error"); }
      afcLoaderOff();
    },
    TOGGLE_ACTIVE: async function (key) {
      afcLoader("Toggling...");
      try {
        var v = await afcToggleField("dietPlans/" + key, "active");
        afcToast(v ? "Activated." : "Deactivated.", "success");
      } catch (err) { afcToast("Failed.", "error"); }
      afcLoaderOff();
    },
    DELETE: async function (key) {
      var ok = await afcConfirmDelete("diet plan " + key);
      if (!ok) return;
      afcLoader("Deleting...");
      try { await afcDbRemove("dietPlans/" + key); afcToast("Deleted.", "success"); }
      catch (err) { afcToast("Failed to delete.", "error"); }
      afcLoaderOff();
    }
  });
})();
</script>
</body>
</html>
