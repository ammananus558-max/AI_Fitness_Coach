<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercises · Admin · AI FITNESS COACH</title>
<script src="../js/theme.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet"><link href="../css/admin.css" rel="stylesheet">
<link href="../css/animations.css" rel="stylesheet"><link href="../css/responsive.css" rel="stylesheet">
</head>
<body>
<div class="admin-shell"><aside id="sidebarMount"></aside>
<div class="admin-body"><header id="headerMount"></header><main class="admin-main" id="mainContent">
  <div class="admin-toolbar">
    <input type="text" class="form-control search-box" id="searchInput" placeholder="Search exercises...">
    <button class="btn btn-fire" id="addBtn"><i class="bi bi-plus-lg me-1"></i>Add Exercise</button>
    <button class="btn btn-outline-primary" id="addImgBtn"><i class="bi bi-image me-1"></i>Add with Image Upload</button>
  </div>
  <div class="tile admin-table-card" id="tableWrap"></div>
</main></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/firebase-config.js"></script><script src="../js/utils.js"></script>
<script src="../js/firebase-auth.js"></script><script src="../js/firebase-db.js"></script>
<script src="../js/firebase-storage.js"></script><script src="../js/app.js"></script>
<script src="../js/admin-auth.js"></script><script src="../js/admin.js"></script>
<script>
(async function () {
  try { await requireAdmin(); } catch (e) { return; }
  afcMountLayout("exercises", { admin: true });

  var allData = {};
  var categories = ["Full Body","Core","Chest","Back","Arms","Legs","Cardio"];
  var difficulties = ["Beginner","Intermediate","Advanced"];

  function exerciseFields(ex) {
    ex = ex || {};
    return [
      { key: "name", label: "Name", type: "text", value: ex.name || "", placeholder: "Exercise name" },
      { key: "category", label: "Category", type: "select", options: categories, value: ex.category || "" },
      { key: "difficulty", label: "Difficulty", type: "select", options: difficulties, value: ex.difficulty || "" },
      { key: "sets", label: "Sets", type: "number", value: ex.sets || 3, min: 0 },
      { key: "reps", label: "Reps", type: "number", value: ex.reps || 0, min: 0 },
      { key: "duration", label: "Duration (sec)", type: "number", value: ex.duration || 0, min: 0 },
      { key: "rest", label: "Rest (sec)", type: "number", value: ex.rest || 30, min: 0 },
      { key: "instructions", label: "Instructions", textarea: true, rows: 3, value: ex.instructions || "" },
      { key: "image", label: "Image URL", type: "text", value: ex.image || "", placeholder: "https://..." },
      { key: "videoURL", label: "Video URL (GIF/MP4/YouTube)", type: "text", value: ex.videoURL || "", placeholder: "https://..." }
    ];
  }

  function renderTable() {
    var html = afcAdminTable({
      columns: [
        { key: "name", label: "Name" },
        { key: "category", label: "Category" },
        { key: "difficulty", label: "Difficulty" },
        { key: "sets", label: "Sets" },
        { key: "reps", label: "Reps" },
        { key: "duration", label: "Duration" },
        { key: "rest", label: "Rest" },
        { key: "_media", label: "Media", render: function (row) {
          if (row.image || row.videoURL) return '<i class="bi bi-image-fill text-success"></i>';
          return '<i class="bi bi-dash text-muted-2"></i>';
        }}
      ],
      rows: allData,
      actions: [
        { icon: "pencil-square", title: "EDIT", cls: "btn-outline-warning" },
        { icon: "trash3-fill", title: "DELETE", cls: "btn-outline-danger" }
      ]
    });
    document.getElementById("tableWrap").innerHTML = html;
    afcAdminSearchFilter("#searchInput", "#tableWrap tr[data-key]");
  }

  afcLoader("Loading exercises...");
  try {
    await afcDbOnValue("exercises", function (data) {
      allData = data || {};
      renderTable();
      afcLoaderOff();
    });
  } catch (err) { afcToast("Failed to load exercises.", "error"); afcLoaderOff(); }

  async function addExercise(withUpload) {
    var data = await afcFormModal({ title: "Add Exercise", fields: exerciseFields(), okText: "Save" });
    if (!data) return;
    var slug = afcSlugify(data.name);
    if (!slug) { afcToast("Please enter a valid name.", "error"); return; }

    if (withUpload) {
      var file = await afcPickImage();
      if (file) {
        var err = afcValidateImage(file);
        if (err) { afcToast(err, "error"); return; }
        afcLoader("Uploading image...");
        try {
          var url = await afcUpload("exercises/" + slug + "/image.jpg", file);
          data.image = url;
        } catch (e) { afcToast("Image upload failed.", "error"); }
        afcLoaderOff();
      }
    }

    afcLoader("Saving exercise...");
    try {
      var rec = {
        name: data.name, category: data.category, difficulty: data.difficulty,
        sets: Number(data.sets) || 0, reps: Number(data.reps) || 0,
        duration: Number(data.duration) || 0, rest: Number(data.rest) || 0,
        instructions: data.instructions, image: data.image || "", videoURL: data.videoURL || ""
      };
      await afcDbSet("exercises/" + slug, rec);
      afcToast("Exercise saved.", "success");
    } catch (err) { afcToast("Failed to save exercise.", "error"); }
    afcLoaderOff();
  }

  document.getElementById("addBtn").addEventListener("click", function () { addExercise(false); });
  document.getElementById("addImgBtn").addEventListener("click", function () { addExercise(true); });

  afcAdminBindActions(document.getElementById("tableWrap"), {
    EDIT: async function (key) {
      var ex = allData[key];
      if (!ex) return;
      var data = await afcFormModal({ title: "Edit Exercise", fields: exerciseFields(ex), okText: "Save" });
      if (!data) return;
      afcLoader("Saving...");
      try {
        await afcDbUpdate("exercises/" + key, {
          name: data.name, category: data.category, difficulty: data.difficulty,
          sets: Number(data.sets) || 0, reps: Number(data.reps) || 0,
          duration: Number(data.duration) || 0, rest: Number(data.rest) || 0,
          instructions: data.instructions, image: data.image || "", videoURL: data.videoURL || ""
        });
        afcToast("Exercise updated.", "success");
      } catch (err) { afcToast("Failed to update.", "error"); }
      afcLoaderOff();
    },
    DELETE: async function (key) {
      var ok = await afcConfirmDelete("exercise " + key);
      if (!ok) return;
      afcLoader("Deleting...");
      try { await afcDbRemove("exercises/" + key); afcToast("Exercise deleted.", "success"); }
      catch (err) { afcToast("Failed to delete.", "error"); }
      afcLoaderOff();
    }
  });
})();
</script>
</body>
</html>
