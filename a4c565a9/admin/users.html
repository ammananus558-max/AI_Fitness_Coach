<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Users · Admin · AI FITNESS COACH</title>
<script src="../js/theme.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet"><link href="../css/admin.css" rel="stylesheet">
<link href="../css/animations.css" rel="stylesheet"><link href="../css/responsive.css" rel="stylesheet">
</head>
<body>
<div class="admin-shell"><aside id="sidebarMount"></aside>
<div class="admin-body"><header id="headerMount"></header><main class="admin-main" id="mainContent">
  <div class="admin-toolbar">
    <input type="text" class="form-control search-box" id="searchInput" placeholder="Search users...">
    <select class="form-select w-auto" id="goalFilter"><option value="">All Goals</option>
      <option value="lose-weight">Lose Weight</option><option value="gain-muscle">Gain Muscle</option>
      <option value="stay-healthy">Stay Healthy</option><option value="improve-fitness">Improve Fitness</option>
    </select>
    <select class="form-select w-auto" id="statusFilter">
      <option value="">All Status</option><option value="active">Active</option><option value="disabled">Disabled</option>
    </select>
  </div>
  <div class="tile admin-table-card" id="tableWrap"></div>
</main></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/firebase-config.js"></script><script src="../js/utils.js"></script>
<script src="../js/firebase-auth.js"></script><script src="../js/firebase-db.js"></script>
<script src="../js/firebase-storage.js"></script><script src="../js/app.js"></script>
<script src="../js/admin-auth.js"></script><script src="../js/admin.js"></script>
<script>
(async function () {
  try { await requireAdmin(); } catch (e) { return; }
  afcMountLayout("users", { admin: true });

  var allUsers = {};

  function subChip(u) {
    if (u.subscription && u.subscription.status === "active") return '<span class="badge bg-success">Active</span>';
    if (u.trial) return '<span class="badge bg-warning text-dark">Trial</span>';
    return '<span class="badge bg-secondary">None</span>';
  }

  function statusChip(u) {
    if (u.status === "disabled") return '<span class="badge bg-danger">Disabled</span>';
    return '<span class="badge bg-success">Active</span>';
  }

  function renderTable() {
    var goalQ = document.getElementById("goalFilter").value;
    var statusQ = document.getElementById("statusFilter").value;
    var filtered = [];
    Object.keys(allUsers).forEach(function (k) {
      var u = allUsers[k];
      if (!u) return;
      if (goalQ && u.goal !== goalQ) return;
      if (statusQ && (u.status || "active") !== statusQ) return;
      filtered.push([k, u]);
    });
    /* Sort by createdAt desc */
    filtered.sort(function (a, b) { return (b[1].createdAt || 0) - (a[1].createdAt || 0); });

    var html = afcAdminTable({
      columns: [
        { key: "name", label: "Name", render: function (row) {
          var initials = (row.name || "?")[0].toUpperCase();
          return '<span class="avatar-chip me-2" style="width:32px;height:32px;font-size:0.8rem">' + afcEscape(initials) + '</span>' + afcEscape(row.name || "—");
        }},
        { key: "email", label: "Email" },
        { key: "goal", label: "Goal", render: function (row) { return afcEscape(row.goal || "—"); } },
        { key: "bmi", label: "BMI", render: function (row) { return row.bmi != null ? row.bmi : "—"; } },
        { key: "calories", label: "Calories", render: function (row) { return row.calories && row.calories.target ? row.calories.target : "—"; } },
        { key: "_sub", label: "Subscription", render: function (row) { return subChip(row); } },
        { key: "_status", label: "Status", render: function (row) { return statusChip(row); } },
        { key: "createdAt", label: "Created", render: function (row) { return row.createdAt ? afcFmtDateTime(row.createdAt) : "—"; } }
      ],
      rows: filtered,
      actions: [
        { icon: "eye-fill", title: "VIEW", cls: "btn-outline-primary" },
        { icon: "pencil-square", title: "EDIT", cls: "btn-outline-warning" },
        { icon: "power", title: "TOGGLE_STATUS", cls: "btn-outline-info" },
        { icon: "trash3-fill", title: "DELETE", cls: "btn-outline-danger" }
      ]
    });
    document.getElementById("tableWrap").innerHTML = html;
    afcAdminSearchFilter("#searchInput", "#tableWrap tr[data-key]");
  }

  afcLoader("Loading users...");
  try {
    var unsub = await afcDbOnValue("users", function (data) {
      allUsers = data || {};
      renderTable();
      afcLoaderOff();
    });
  } catch (err) {
    afcToast("Failed to load users.", "error");
    afcLoaderOff();
  }

  document.getElementById("goalFilter").addEventListener("change", renderTable);
  document.getElementById("statusFilter").addEventListener("change", renderTable);

  afcAdminBindActions(document.getElementById("tableWrap"), {
    VIEW: async function (key) {
      var u = allUsers[key];
      if (!u) return;
      var pretty = JSON.stringify(u, null, 2);
      await afcConfirm({ title: "User: " + (u.name || key), body: '<pre style="max-height:400px;overflow:auto;font-size:0.82rem">' + afcEscape(pretty) + "</pre>", okText: "Close" });
    },
    EDIT: async function (key) {
      var u = allUsers[key];
      if (!u) return;
      var data = await afcFormModal({
        title: "Edit User",
        fields: [
          { key: "name", label: "Name", type: "text", value: u.name || "" },
          { key: "role", label: "Role (note: does NOT grant panel access; admins node is separate)", type: "select", options: ["user", "admin"], value: u.role || "user" }
        ],
        okText: "Save"
      });
      if (!data) return;
      afcBusy(null, false);
      try {
        afcLoader("Saving...");
        await afcDbUpdate("users/" + key, { name: data.name, role: data.role });
        afcToast("User updated.", "success");
      } catch (err) {
        afcToast("Failed to update user.", "error");
      }
      afcLoaderOff();
    },
    TOGGLE_STATUS: async function (key) {
      var u = allUsers[key];
      if (!u) return;
      var newStatus = u.status === "disabled" ? "active" : "disabled";
      try {
        afcLoader("Updating...");
        await afcDbUpdate("users/" + key, { status: newStatus });
        afcToast("User " + newStatus + ".", "success");
      } catch (err) {
        afcToast("Failed to update status.", "error");
      }
      afcLoaderOff();
    },
    DELETE: async function (key) {
      var ok = await afcConfirmDelete("user " + key);
      if (!ok) return;
      try {
        afcLoader("Deleting...");
        await afcDbRemove("users/" + key);
        afcToast("User deleted.", "success");
      } catch (err) {
        afcToast("Failed to delete user.", "error");
      }
      afcLoaderOff();
    }
  });
})();
</script>
</body>
</html>
