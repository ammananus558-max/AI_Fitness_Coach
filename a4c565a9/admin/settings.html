<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · Admin · AI FITNESS COACH</title>
<script src="../js/theme.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet"><link href="../css/admin.css" rel="stylesheet">
<link href="../css/animations.css" rel="stylesheet"><link href="../css/responsive.css" rel="stylesheet">
</head>
<body>
<div class="admin-shell"><aside id="sidebarMount"></aside>
<div class="admin-body"><header id="headerMount"></header><main class="admin-main" id="mainContent">

  <!-- Settings Form -->
  <div class="tile p-4 mb-4">
    <h5 class="fw-bold mb-3"><i class="bi bi-gear-fill me-2"></i>App Settings</h5>
    <form id="settingsForm">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Site Name</label>
          <input type="text" class="form-control" id="siteName">
        </div>
        <div class="col-md-6">
          <label class="form-label">Logo URL</label>
          <input type="text" class="form-control" id="logoURL" placeholder="https://...">
        </div>
        <div class="col-md-4">
          <label class="form-label">Primary Color</label>
          <input type="color" class="form-control form-control-color w-100" id="primaryColor">
        </div>
        <div class="col-md-4">
          <label class="form-label">Trial Days</label>
          <input type="number" class="form-control" id="trialDays" min="1" max="365">
        </div>
        <div class="col-md-4">
          <label class="form-label">Water Goal (glasses/day)</label>
          <input type="number" class="form-control" id="waterGoal" min="1" max="50">
        </div>
        <div class="col-md-6">
          <label class="form-label">Contact Email</label>
          <input type="email" class="form-control" id="contactEmail">
        </div>
      </div>
      <button type="submit" class="btn btn-fire mt-3" id="saveBtn"><i class="bi bi-check-lg me-1"></i>Save Settings</button>
    </form>
  </div>

  <!-- Data Management -->
  <div class="tile p-4">
    <h5 class="fw-bold mb-3"><i class="bi bi-database-fill me-2"></i>Data Management</h5>
    <!--
      Export/Import is a convenience feature for the student project.
      In production, use Firebase's built-in backup/export tools or
      a server-side solution for data management.
    -->
    <div class="d-flex gap-2 flex-wrap">
      <button class="btn btn-outline-primary" id="exportBtn"><i class="bi bi-download me-1"></i>Export Data</button>
      <div class="position-relative">
        <input type="file" class="form-control" id="importFile" accept=".json" style="opacity:0;position:absolute;width:100%;height:100%;cursor:pointer">
        <button class="btn btn-outline-warning" id="importBtnLabel"><i class="bi bi-upload me-1"></i>Import Data</button>
      </div>
      <button class="btn btn-outline-danger" id="resetBtn"><i class="bi bi-arrow-counterclockwise me-1"></i>Reset Demo Data</button>
    </div>
  </div>

</main></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/firebase-config.js"></script><script src="../js/utils.js"></script>
<script src="../js/firebase-auth.js"></script><script src="../js/firebase-db.js"></script>
<script src="../js/firebase-storage.js"></script><script src="../js/app.js"></script>
<script src="../js/demo-data.js"></script>
<script src="../js/admin-auth.js"></script><script src="../js/admin.js"></script>
<script>
(async function () {
  try { await requireAdmin(); } catch (e) { return; }
  afcMountLayout("settings", { admin: true });

  /* Load current settings */
  afcLoader("Loading settings...");
  var settings = {};
  try {
    settings = await afcDbGet("settings") || {};
  } catch (err) { /* empty */ }
  afcLoaderOff();

  document.getElementById("siteName").value = settings.siteName || "";
  document.getElementById("logoURL").value = settings.logoURL || "";
  document.getElementById("primaryColor").value = settings.primaryColor || "#ff2e63";
  document.getElementById("trialDays").value = settings.trialDays || 7;
  document.getElementById("waterGoal").value = settings.waterGoal || 8;
  document.getElementById("contactEmail").value = settings.contactEmail || "";

  /* Apply primary color live preview */
  document.getElementById("primaryColor").addEventListener("input", function () {
    document.documentElement.style.setProperty("--primary", this.value);
  });

  /* Save settings */
  document.getElementById("settingsForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    var btn = document.getElementById("saveBtn");
    afcBusy(btn, true, "Saving...");
    try {
      var vals = {
        siteName: document.getElementById("siteName").value.trim(),
        logoURL: document.getElementById("logoURL").value.trim(),
        primaryColor: document.getElementById("primaryColor").value,
        trialDays: Number(document.getElementById("trialDays").value) || 7,
        waterGoal: Number(document.getElementById("waterGoal").value) || 8,
        contactEmail: document.getElementById("contactEmail").value.trim()
      };
      await afcDbUpdate("settings", vals);
      document.documentElement.style.setProperty("--primary", vals.primaryColor);
      afcToast("Settings saved.", "success");
    } catch (err) {
      afcToast("Failed to save settings.", "error");
    }
    afcBusy(btn, false);
  });

  /* Export Data */
  document.getElementById("exportBtn").addEventListener("click", async function () {
    afcLoader("Exporting data...");
    try {
      var collections = ["settings","goals","exercises","workouts","meals","dietPlans","weeklyPlans","pricing","chatbot"];
      var exportObj = {};
      for (var i = 0; i < collections.length; i++) {
        exportObj[collections[i]] = await afcDbGet(collections[i]) || null;
      }
      var json = JSON.stringify(exportObj, null, 2);
      var blob = new Blob([json], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "afc-export-" + afcTodayKey() + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      afcToast("Data exported.", "success");
    } catch (err) {
      afcToast("Export failed.", "error");
    }
    afcLoaderOff();
  });

  /* Import Data */
  document.getElementById("importFile").addEventListener("change", async function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var ok = await afcConfirm({ title: "Import Data?", body: "This will overwrite existing data for recognized collections. Continue?", okText: "Import", danger: true });
    if (!ok) { e.target.value = ""; return; }
    afcLoader("Importing data...");
    try {
      var text = await file.text();
      var data = JSON.parse(text);
      var recognizedKeys = ["settings","goals","exercises","workouts","meals","dietPlans","weeklyPlans","pricing","chatbot"];
      for (var i = 0; i < recognizedKeys.length; i++) {
        var k = recognizedKeys[i];
        if (data[k] != null) {
          await afcDbSet(k, data[k]);
        }
      }
      afcToast("Data imported successfully.", "success");
    } catch (err) {
      afcToast("Import failed: " + (err.message || "invalid JSON"), "error");
    }
    afcLoaderOff();
    e.target.value = "";
  });

  /* Reset Demo Data */
  document.getElementById("resetBtn").addEventListener("click", async function () {
    var ok = await afcConfirm({
      title: "Reset Demo Data?",
      body: "This will overwrite all collections with the default demo data. This cannot be undone.",
      okText: "Reset",
      danger: true
    });
    if (!ok) return;
    try {
      await afcSeedDemoData(function (step) {
        afcLoader(step);
      });
      afcToast("Demo data restored.", "success");
    } catch (err) {
      afcToast("Reset failed.", "error");
    }
    afcLoaderOff();
  });
})();
</script>
</body>
</html>
