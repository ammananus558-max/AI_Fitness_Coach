<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meals · Admin · AI FITNESS COACH</title>
<script src="../js/theme.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet"><link href="../css/admin.css" rel="stylesheet">
<link href="../css/animations.css" rel="stylesheet"><link href="../css/responsive.css" rel="stylesheet">
</head>
<body>
<div class="admin-shell"><aside id="sidebarMount"></aside>
<div class="admin-body"><header id="headerMount"></header><main class="admin-main" id="mainContent">
  <div class="admin-toolbar">
    <input type="text" class="form-control search-box" id="searchInput" placeholder="Search meals...">
    <button class="btn btn-fire" id="addBtn"><i class="bi bi-plus-lg me-1"></i>Add Meal</button>
    <button class="btn btn-outline-primary" id="addImgBtn"><i class="bi bi-image me-1"></i>Add with Image Upload</button>
  </div>
  <div class="tile admin-table-card" id="tableWrap"></div>
</main></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/firebase-config.js"></script><script src="../js/utils.js"></script>
<script src="../js/firebase-auth.js"></script><script src="../js/firebase-db.js"></script>
<script src="../js/firebase-storage.js"></script><script src="../js/app.js"></script>
<script src="../js/admin-auth.js"></script><script src="../js/admin.js"></script>
<script>
(async function () {
  try { await requireAdmin(); } catch (e) { return; }
  afcMountLayout("meals", { admin: true });

  var allData = {};
  var categories = ["breakfast","lunch","snack","dinner"];

  function mealFields(m) {
    m = m || {};
    return [
      { key: "name", label: "Name", type: "text", value: m.name || "" },
      { key: "category", label: "Category", type: "select", options: categories, value: m.category || "" },
      { key: "calories", label: "Calories", type: "number", value: m.calories || 0, min: 0 },
      { key: "protein", label: "Protein (g)", type: "number", value: m.protein || 0, min: 0 },
      { key: "carbs", label: "Carbs (g)", type: "number", value: m.carbs || 0, min: 0 },
      { key: "fat", label: "Fat (g)", type: "number", value: m.fat || 0, min: 0 },
      { key: "description", label: "Description", textarea: true, rows: 2, value: m.description || "" },
      { key: "image", label: "Image URL", type: "text", value: m.image || "", placeholder: "https://..." }
    ];
  }

  function renderTable() {
    var html = afcAdminTable({
      columns: [
        { key: "name", label: "Name" },
        { key: "category", label: "Category" },
        { key: "calories", label: "Cal" },
        { key: "protein", label: "P" },
        { key: "carbs", label: "C" },
        { key: "fat", label: "F" },
        { key: "_active", label: "Active", render: function (row) {
          return row.active !== false ? '<span class="badge bg-success">Yes</span>' : '<span class="badge bg-secondary">No</span>';
        }}
      ],
      rows: allData,
      actions: [
        { icon: "pencil-square", title: "EDIT", cls: "btn-outline-warning" },
        { icon: "power", title: "TOGGLE_ACTIVE", cls: "btn-outline-secondary" },
        { icon: "trash3-fill", title: "DELETE", cls: "btn-outline-danger" }
      ]
    });
    document.getElementById("tableWrap").innerHTML = html;
    afcAdminSearchFilter("#searchInput", "#tableWrap tr[data-key]");
  }

  afcLoader("Loading meals...");
  try {
    await afcDbOnValue("meals", function (data) {
      allData = data || {};
      renderTable();
      afcLoaderOff();
    });
  } catch (err) { afcToast("Failed to load meals.", "error"); afcLoaderOff(); }

  async function addMeal(withUpload) {
    var data = await afcFormModal({ title: "Add Meal", fields: mealFields(), okText: "Save" });
    if (!data) return;
    var slug = afcSlugify(data.name);
    if (!slug) { afcToast("Enter a valid name.", "error"); return; }

    if (withUpload) {
      var file = await afcPickImage();
      if (file) {
        var err = afcValidateImage(file);
        if (err) { afcToast(err, "error"); return; }
        afcLoader("Uploading image...");
        try {
          var url = await afcUpload("meals/" + slug + "/image.jpg", file);
          data.image = url;
        } catch (e) { afcToast("Upload failed.", "error"); }
        afcLoaderOff();
      }
    }

    afcLoader("Saving...");
    try {
      await afcDbSet("meals/" + slug, {
        name: data.name, category: data.category,
        calories: Number(data.calories) || 0, protein: Number(data.protein) || 0,
        carbs: Number(data.carbs) || 0, fat: Number(data.fat) || 0,
        description: data.description, image: data.image || "", active: true
      });
      afcToast("Meal saved.", "success");
    } catch (err) { afcToast("Failed to save.", "error"); }
    afcLoaderOff();
  }

  document.getElementById("addBtn").addEventListener("click", function () { addMeal(false); });
  document.getElementById("addImgBtn").addEventListener("click", function () { addMeal(true); });

  afcAdminBindActions(document.getElementById("tableWrap"), {
    EDIT: async function (key) {
      var m = allData[key]; if (!m) return;
      var data = await afcFormModal({ title: "Edit Meal", fields: mealFields(m), okText: "Save" });
      if (!data) return;
      afcLoader("Saving...");
      try {
        await afcDbUpdate("meals/" + key, {
          name: data.name, category: data.category,
          calories: Number(data.calories) || 0, protein: Number(data.protein) || 0,
          carbs: Number(data.carbs) || 0, fat: Number(data.fat) || 0,
          description: data.description, image: data.image || ""
        });
        afcToast("Meal updated.", "success");
      } catch (err) { afcToast("Failed to update.", "error"); }
      afcLoaderOff();
    },
    TOGGLE_ACTIVE: async function (key) {
      afcLoader("Toggling...");
      try {
        var v = await afcToggleField("meals/" + key, "active");
        afcToast(v ? "Activated." : "Deactivated.", "success");
      } catch (err) { afcToast("Failed.", "error"); }
      afcLoaderOff();
    },
    DELETE: async function (key) {
      var ok = await afcConfirmDelete("meal " + key);
      if (!ok) return;
      afcLoader("Deleting...");
      try { await afcDbRemove("meals/" + key); afcToast("Deleted.", "success"); }
      catch (err) { afcToast("Failed to delete.", "error"); }
      afcLoaderOff();
    }
  });
})();
</script>
</body>
</html>
