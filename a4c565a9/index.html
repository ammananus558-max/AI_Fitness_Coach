<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI FITNESS COACH</title>
  <meta name="description" content="Your personalized fitness, workout and nutrition coach.">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="splash" id="splash" role="status" aria-label="Loading AI Fitness Coach">
    <div class="brand-badge anim-float"><i class="bi bi-heart-pulse-fill" aria-hidden="true"></i></div>
    <h1 class="gradient-text">AI FITNESS COACH</h1>
    <p>YOUR PERSONAL FITNESS JOURNEY</p>
    <div class="splash-bar" aria-hidden="true"><span></span></div>
  </div>

  <script>
    /* Splash: animate, then continue to the welcome page. */
    setTimeout(function () {
      const splash = document.getElementById("splash");
      splash.classList.add("leaving");
      setTimeout(function () { location.replace("welcome.html"); }, 500);
    }, 2200);
  </script>
</body>
</html>
