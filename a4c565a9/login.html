<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · AI FITNESS COACH</title>
  <script src="js/theme.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/animations.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card tile anim-scale">
      <!-- Brand -->
      <div class="auth-brand">
        <div class="brand-badge"><i class="bi bi-heart-pulse-fill" aria-hidden="true"></i></div>
        <h4 class="fw-bold mt-2 mb-0">AI FITNESS COACH</h4>
      </div>

      <h3 class="fw-bold text-center mb-4">WELCOME BACK</h3>

      <!-- Email -->
      <div class="mb-3">
        <label class="form-label" for="loginEmail">Email</label>
        <div class="input-icon">
          <i class="bi bi-envelope" aria-hidden="true"></i>
          <input type="email" class="form-control" id="loginEmail" placeholder="you@example.com" autocomplete="email" aria-label="Email address">
        </div>
      </div>

      <!-- Password with toggle -->
      <div class="mb-3">
        <label class="form-label" for="loginPass">Password</label>
        <div class="input-icon">
          <i class="bi bi-lock" aria-hidden="true"></i>
          <input type="password" class="form-control" id="loginPass" placeholder="Enter your password" autocomplete="current-password" aria-label="Password" style="padding-right:2.8rem">
          <button type="button" class="btn p-0 position-absolute end-0 top-50 translate-middle-y me-3 text-muted-2" id="togglePass" aria-label="Show password" style="background:none;border:none;z-index:2">
            <i class="bi bi-eye" id="togglePassIcon"></i>
          </button>
        </div>
      </div>

      <!-- Error area -->
      <div class="invalid-feedback-2 mb-3" id="loginError" role="alert"></div>

      <!-- Login button -->
      <button class="btn btn-fire btn-block btn-lg-2 mb-3" id="loginBtn">LOGIN</button>

      <!-- Divider -->
      <div class="auth-divider">OR</div>

      <!-- Google -->
      <button class="btn btn-ghost btn-block mb-3" id="googleBtn"><i class="bi bi-google me-2"></i>CONTINUE WITH GOOGLE</button>

      <!-- Links -->
      <div class="d-flex justify-content-between" style="font-size:.9rem">
        <a href="signup.html">CREATE ACCOUNT</a>
        <a href="forgot-password.html">FORGOT PASSWORD</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/firebase-auth.js"></script>
  <script src="js/firebase-db.js"></script>
  <script src="js/firebase-storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
  (async function () {
    /* Check Firebase config */
    try {
      await window.afcFirebaseReady();
    } catch (e) {
      afcSetupBanner();
      return;
    }

    var emailInput = qs("#loginEmail");
    var passInput = qs("#loginPass");
    var errEl = qs("#loginError");
    var loginBtn = qs("#loginBtn");
    var toggleBtn = qs("#togglePass");
    var toggleIcon = qs("#togglePassIcon");

    /* Password visibility toggle */
    if (toggleBtn && passInput) {
      toggleBtn.addEventListener("click", function () {
        var isPass = passInput.type === "password";
        passInput.type = isPass ? "text" : "password";
        if (toggleIcon) toggleIcon.className = "bi " + (isPass ? "bi-eye-slash" : "bi-eye");
        toggleBtn.setAttribute("aria-label", isPass ? "Hide password" : "Show password");
      });
    }

    /* Login handler */
    if (loginBtn) {
      loginBtn.addEventListener("click", async function () {
        if (errEl) errEl.textContent = "";
        var email = emailInput.value.trim();
        var pass = passInput.value;

        if (!afcValidEmail(email)) {
          if (errEl) errEl.textContent = "Please enter a valid email address.";
          return;
        }
        if (!afcValidPassword(pass)) {
          if (errEl) errEl.textContent = "Password must be at least 6 characters.";
          return;
        }

        afcBusy(loginBtn, true, "Signing in...");
        try {
          var result = await afcSignIn(email, pass);
          await afcAfterAuthRoute(result.user);
        } catch (err) {
          afcBusy(loginBtn, false);
          if (errEl) errEl.textContent = afcFriendlyAuthError(err);
        }
      });
    }

    /* Enter key submits */
    [emailInput, passInput].forEach(function (el) {
      if (el) el.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); if (loginBtn) loginBtn.click(); }
      });
    });

    /* Google sign-in */
    afcBindGoogle("#googleBtn");
  })();
  </script>
</body>
</html>
