<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workouts · AI FITNESS COACH</title>
  <script src="js/theme.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet"><link href="css/animations.css" rel="stylesheet"><link href="css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell"><aside id="sidebarMount"></aside>
    <div class="app-body"><header id="headerMount"></header>
      <main class="app-main" id="mainContent">

        <div class="page-head reveal">
          <h1>WORKOUTS</h1>
          <p>Browse and start a workout session</p>
        </div>

        <!-- Filter -->
        <div class="d-flex gap-2 mb-4 flex-wrap reveal" id="workoutFilters">
          <button class="chip fire active" data-filter="my-goal" aria-pressed="true">My Goal</button>
          <button class="chip" data-filter="all" aria-pressed="false">All Workouts</button>
        </div>

        <!-- Workout grid -->
        <div class="row g-3 reveal" id="workoutGrid">
          <div class="col-12"><div class="empty-state"><i class="bi bi-hourglass-split" aria-hidden="true"></i><p>Loading workouts...</p></div></div>
        </div>

      </main>
    </div>
  </div>
  <nav id="bottomNavMount"></nav>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/firebase-config.js"></script><script src="js/utils.js"></script>
  <script src="js/firebase-auth.js"></script><script src="js/firebase-db.js"></script>
  <script src="js/firebase-storage.js"></script><script src="js/app.js"></script>
  <script src="js/streak.js"></script><script src="js/chatbot.js"></script>
  <script src="js/workout.js"></script>
</body>
</html>
