<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password · AI FITNESS COACH</title>
  <script src="js/theme.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/animations.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card tile anim-scale">
      <!-- Brand -->
      <div class="auth-brand">
        <div class="brand-badge"><i class="bi bi-heart-pulse-fill" aria-hidden="true"></i></div>
        <h4 class="fw-bold mt-2 mb-0">AI FITNESS COACH</h4>
      </div>

      <!-- Form state -->
      <div id="resetForm">
        <h3 class="fw-bold text-center mb-2">RESET PASSWORD</h3>
        <p class="text-muted-2 text-center mb-4" style="font-size:.9rem">Enter your email and we'll send you a link to reset your password.</p>

        <!-- Email -->
        <div class="mb-3">
          <label class="form-label" for="resetEmail">Email</label>
          <div class="input-icon">
            <i class="bi bi-envelope" aria-hidden="true"></i>
            <input type="email" class="form-control" id="resetEmail" placeholder="you@example.com" autocomplete="email" aria-label="Email address">
          </div>
        </div>

        <!-- Error area -->
        <div class="invalid-feedback-2 mb-3" id="resetError" role="alert"></div>

        <!-- Send button -->
        <button class="btn btn-fire btn-block btn-lg-2 mb-3" id="resetBtn">SEND RESET LINK</button>
      </div>

      <!-- Success state (hidden initially) -->
      <div id="resetSuccess" class="text-center d-none">
        <div style="width:72px;height:72px;border-radius:50%;background:rgba(34,197,94,.14);color:var(--success);display:grid;place-items:center;font-size:2rem;margin:0 auto 1rem">
          <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
        </div>
        <h3 class="fw-bold mb-2">CHECK YOUR INBOX</h3>
        <p class="text-muted-2 mb-4">We've sent a password reset link to your email. Click the link in the email to set a new password.</p>
      </div>

      <!-- Back link -->
      <div class="text-center" style="font-size:.9rem">
        <a href="login.html"><i class="bi bi-arrow-left me-1"></i>BACK TO LOGIN</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/firebase-auth.js"></script>
  <script src="js/firebase-db.js"></script>
  <script src="js/firebase-storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
  (async function () {
    try {
      await window.afcFirebaseReady();
    } catch (e) {
      afcSetupBanner();
      return;
    }

    var emailInput = qs("#resetEmail");
    var errEl = qs("#resetError");
    var resetBtn = qs("#resetBtn");
    var formDiv = qs("#resetForm");
    var successDiv = qs("#resetSuccess");

    if (resetBtn) {
      resetBtn.addEventListener("click", async function () {
        if (errEl) errEl.textContent = "";
        var email = emailInput.value.trim();

        if (!afcValidEmail(email)) {
          if (errEl) errEl.textContent = "Please enter a valid email address.";
          return;
        }

        afcBusy(resetBtn, true, "Sending...");
        try {
          await afcSendPasswordReset(email);
          afcBusy(resetBtn, false);
          if (formDiv) formDiv.classList.add("d-none");
          if (successDiv) successDiv.classList.remove("d-none");
        } catch (err) {
          afcBusy(resetBtn, false);
          if (errEl) errEl.textContent = afcFriendlyAuthError(err);
        }
      });
    }

    /* Enter key submits */
    if (emailInput) {
      emailInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); if (resetBtn) resetBtn.click(); }
      });
    }
  })();
  </script>
</body>
</html>
